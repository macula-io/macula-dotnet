name: Release to NuGet

on:
  push:
    tags: ['v*']

jobs:

  # The release guard. version-root names the directory whose manifest
  # carries the version this repository publishes; the default is the root.
  release-guard:
    name: The release guard
    uses: macula-io/macula-ci-images/.github/workflows/release-guard.yml@2660ee4ce1c51ce3d2bf14043ebc8a2784065cd9
    with:
      version-root: src/Macula
  # The docs check the repository runs on every push, run again on the tag: the
  # package about to be published is the one the blocks are compiled against
  # (macula-codebase-checks#8).
  docs:
    name: docs (C# snippets)
    permissions:
      contents: read
    uses: macula-io/macula-ci-images/.github/workflows/doc-snippets-csharp.yml@d25a36c1b6ba7b8e72db17873aa7c2c7793eba70
  # A dependency the packages restore with a published advisory does not publish
  # (macula-codebase-checks#11). It runs here as well as in ci.yml because a green
  # main is not a gate on the tag.
  advisories:
    permissions:
      contents: read
    uses: macula-io/macula-ci-images/.github/workflows/dependency-advisories.yml@dbc9533eb409c2118f45110613160060cc582f5d
    with:
      ecosystem: csharp

  publish:
    needs: [release-guard, docs, advisories]
    name: publish to NuGet
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Validate version matches project
        run: |
          PROJECT_VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Macula/Macula.csproj)
          if [ "$PROJECT_VERSION" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "::error::Tag version (${{ steps.version.outputs.VERSION }}) doesn't match project version ($PROJECT_VERSION)"
            exit 1
          fi

      # libmacula for every runtime from the macula-go release libmacula.version
      # names, each file checked against SHA256SUMS and its build provenance
      # attestation. A file that fails is never packed.
      - name: Fetch and verify libmacula
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch_libmacula.sh

      # Rebuilt and retested here rather than trusting the CI run: the tag
      # push is its own event.
      - run: dotnet build --configuration Release
      - run: dotnet test --no-build --configuration Release

      - name: Pack, and check the natives are in it
        run: scripts/check_package.sh ./artifacts

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push ./artifacts/Macula.*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
