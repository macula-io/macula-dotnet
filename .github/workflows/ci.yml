name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The Go interop capture helper, held to the structural floor
  # (macula-codebase-checks#9): nestif 4, gocognit 15, funlen 60, with no
  # baseline and no inline disables. The thresholds live in
  # scripts/interop/capture/.golangci.yml.
  structural-lint:
    name: lint scripts/interop/capture (structural floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: scripts/interop/capture/go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: scripts/interop/capture

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # The tests run macula-go's teststation harness at the libmacula.version
      # release, which needs Go.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      # libmacula for every runtime, each file checked against the release's
      # SHA256SUMS and its build provenance attestation before it is used.
      - name: Fetch and verify libmacula
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch_libmacula.sh
      - run: dotnet build --configuration Release
      # The interop peers are outside the solution, so the line above never
      # sees them: the structural floor (CA1502 at 9, .editorconfig +
      # CodeMetricsConfig.txt) reaches them only when they are built.
      - name: Build the interop peers
        run: |
          dotnet build scripts/interop/Peer --configuration Release
          dotnet build scripts/interop/Signer --configuration Release
      # A test host that crashes leaves a minidump, kept for a week, so the
      # crash seen twice on a saturated box (macula-dotnet#7) can be read
      # the next time it happens instead of guessed at.
      - name: Test
        run: >-
          dotnet test --no-build --configuration Release --results-directory TestResults
          --blame-crash --blame-crash-dump-type mini
      - name: Keep the crash dump of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-crash-${{ matrix.os }}
          path: TestResults/**/*.dmp
          if-no-files-found: ignore
          retention-days: 7
      # The package must carry libmacula for every runtime it promises.
      - name: Pack, and check the natives are in it
        if: matrix.os == 'ubuntu-24.04'
        run: scripts/check_package.sh

  # Every C# block README.md publishes compiles against this package, and a doc
  # change runs this (macula-codebase-checks#8). The pin is a full commit SHA;
  # the release waits on this job too.
  docs:
    name: docs (C# snippets)
    permissions:
      contents: read
    uses: macula-io/macula-ci-images/.github/workflows/doc-snippets-csharp.yml@d25a36c1b6ba7b8e72db17873aa7c2c7793eba70
