name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # The tests run macula-go's teststation harness at the libmacula.version
      # release, which needs Go.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      # libmacula for every runtime, each file checked against the release's
      # SHA256SUMS and its build provenance attestation before it is used.
      - name: Fetch and verify libmacula
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch_libmacula.sh
      - run: dotnet build --configuration Release
      # A test host that crashes leaves a minidump, kept for a week, so the
      # crash seen twice on a saturated box (macula-dotnet#7) can be read
      # the next time it happens instead of guessed at.
      - name: Test
        run: >-
          dotnet test --no-build --configuration Release --results-directory TestResults
          --blame-crash --blame-crash-dump-type mini
      - name: Keep the crash dump of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-crash-${{ matrix.os }}
          path: TestResults/**/*.dmp
          if-no-files-found: ignore
          retention-days: 7
      # The package must carry libmacula for every runtime it promises.
      - name: Pack, and check the natives are in it
        if: matrix.os == 'ubuntu-24.04'
        run: scripts/check_package.sh
